name: Safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/p0-execution-safety-20261124]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy ccxt requests
      - run: python -m compileall -q live_trader.py
      - run: python -m unittest discover -s tests -v
